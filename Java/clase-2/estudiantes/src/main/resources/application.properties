spring.application.name=estudiantes
# 1. URL de conexión (Cambia 'mi_base_de_datos' por el nombre de tu esquema)
spring.datasource.url=jdbc:mysql://localhost:3306/estudiantes
# 2. Credenciales de tu servidor MySQL
spring.datasource.username=root
spring.datasource.password=9488

# 3. Estrategia de creación de tablas (update crea las tablas si no existen)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Desactivar el tomcat
spring.main-web-application-type=none
